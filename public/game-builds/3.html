<html>
  <head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<base href="/ovo3/">

                                          
    <link
      rel="manifest"
      href="/ovo3/appmanifest.json"
    />

                                                                                        
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="/ovo3/icon-256.png"
    />

                                            
    <link
      rel="shortcut icon"
      sizes="256x256"
      href="/ovo3/icon-256.png"
    />

                                                                                    
    <style type="text/css">
      * {
        padding: 0;
        margin: 0;
      }
      html,
      body {
        background: #000;
        color: #fff;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
      }
      canvas {
        touch-action-delay: none;
        touch-action: none;
        -ms-touch-action: none;
      }
    </style>

    <link
      href="/ovo3/animate.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="/ovo3/hmmg_layoutTransition.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="/ovo3/jquery.gritter.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>

  <body>
    <div id="fb-root"></div>

    <script>
                                                                          
      (function () {
                                                      
        if (window.location.protocol.substr(0, 4) === "file") {
          alert(
            "Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)",
          );
        }
      })();
    </script>

                                                               
    <div id="c2canvasdiv">
                                                                                                   
                                                                                        
      <canvas id="c2canvas" width="1920" height="1080">
                                                                                    
                                                                                 
                                                                                 
        <h1>
          Your browser does not appear to support HTML5. Try upgrading your
          browser to the latest version.
          <a href="http://www.whatbrowser.org">What is a browser?</a>
          <br /><br /><a
            href="http://www.microsoft.com/windows/internet-explorer/default.aspx"
            >Microsoft Internet Explorer</a
          ><br />
          <a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br />
          <a href="http://www.google.com/chrome/">Google Chrome</a><br />
          <a href="http://www.apple.com/safari/download/">Apple Safari</a>
        </h1>
      </canvas>
    </div>

                                                         

                                                       
    <script src="/ovo3/jquery-3.4.1.min.js"></script>

    <script src="/ovo3/Tween.js"></script>
    <script src="/ovo3/html2canvas.min.js"></script>
    <script src="/ovo3/jquery.gritter.js"></script>
    <script src="/ovo3/howler.js"></script>

                                                                                                       
                                                                                                      
    <script src="/ovo3/c2runtime.js"></script>

    <script>
                                                              
      jQuery(document).ready(function () {
                                                
        cr_createRuntime("c2canvas");
      });

                                                            
      function onVisibilityChanged() {
        if (
          document.hidden ||
          document.mozHidden ||
          document.webkitHidden ||
          document.msHidden
        )
          cr_setSuspended(true);
        else cr_setSuspended(false);
      }

      document.addEventListener("visibilitychange", onVisibilityChanged, false);
      document.addEventListener(
        "mozvisibilitychange",
        onVisibilityChanged,
        false,
      );
      document.addEventListener(
        "webkitvisibilitychange",
        onVisibilityChanged,
        false,
      );
      document.addEventListener(
        "msvisibilitychange",
        onVisibilityChanged,
        false,
      );

      function OnRegisterSWError(e) {
        console.warn("Failed to register service worker: ", e);
      }

                                                                                           
                                                                                      
      window.C2_RegisterSW = function C2_RegisterSW() {
        if (!navigator.serviceWorker) return;                              

        try {
          navigator.serviceWorker
            .register(
              "/ovo3/sw.js",
              { scope: "./" },
            )
            .then(function (reg) {
              console.log("Registered service worker on " + reg.scope);
            })
            .catch(OnRegisterSWError);
        } catch (e) {
          OnRegisterSWError(e);
        }
      };
    </script>
  <script src="/touch-controls.js"></script></body>
</html>
