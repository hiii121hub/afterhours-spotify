<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Games</title>
		<link rel="stylesheet" href="media.css" />
	</head>
	<body>
		<main>
			<h1>Games</h1>
			<div id="games" class="grid" aria-live="polite"></div>
		</main>
		<dialog id="game-dialog">
			<section id="game-shell">
				<div class="game-toolbar">
					<div>
						<h2 id="game-title"></h2>
						<span id="game-controls"></span>
					</div>
					<div>
						<button id="game-reload" class="quiet">Restart</button
						><button id="game-fullscreen" class="quiet">Fullscreen</button
						><button id="game-close" aria-label="Close game">Close</button>
					</div>
				</div>
				<div id="game-frame"></div>
				<p id="game-message" role="status"></p>
			</section>
		</dialog>
		<script src="games.js"></script>
	</body>
</html>
