<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Spotify · Games</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="index.css" />
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js" defer></script>
		<script src="index.js" defer></script>
	</head>
	<body>
		<header>
			<nav aria-label="Services">
				<button data-service="spotify" class="active">Spotify</button
				><button data-service="games">Games</button>
			</nav>
			<div class="header-actions">
				<button id="spotify-login">Email sign-in</button
				><button id="reload" aria-label="Reload service">↻</button>
			</div>
		</header>
		<div class="notice">
			<span id="service-note"></span
			><a href="/source.tar.gz" download>Source</a>
		</div>
		<main id="stage">
			<div class="start">
				<h1>Spotify</h1>
				<p>Sign-in is currently unavailable in this embedded player.</p>
				<button id="start">Load Spotify</button>
				<p id="status" role="status"></p>
			</div>
		</main>
	</body>
</html>
