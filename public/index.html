<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Afterhours — Spotify</title>
		<link rel="stylesheet" href="index.css" />
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js" defer></script>
		<script src="index.js" defer></script>
	</head>
	<body>
		<header>
			<a class="brand" href="/">afterhours<span>.</span></a>
			<nav aria-label="Services">
				<button data-service="spotify" class="active">Spotify</button
				><button data-service="crunchyroll">Crunchyroll</button>
			</nav>
			<button id="reload" aria-label="Reload service">↻</button>
		</header>
		<div class="notice">
			<span id="service-note"
				>Spotify’s web player. Sign in with your Spotify account.</span
			><a
				href="https://github.com/hiii121hub/afterhours-spotify"
				target="_blank"
				rel="noopener"
				>Source</a
			><a href="credits.html" target="_blank" rel="noopener">Credits</a>
		</div>
		<main id="stage">
			<div class="start">
				<span class="tag">WEB PLAYER</span>
				<h1>Spotify, in the page.</h1>
				<p>
					Loads Spotify’s own web player through Scramjet.<br />A Spotify
					account is still required to play full songs.
				</p>
				<button id="start">Load Spotify</button>
				<p id="status" role="status"></p>
			</div>
		</main>
	</body>
</html>
