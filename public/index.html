<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Afterhours</title>
		<link rel="stylesheet" href="index.css" />
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js" defer></script>
		<script src="index.js" defer></script>
	</head>
	<body>
		<header>
			<a class="brand" href="/">afterhours<span>.</span></a>
			<nav aria-label="Services">
				<button data-service="spotify" class="active">Spotify</button
				><button data-service="games">Games</button
				><button data-service="videos">Videos</button>
			</nav>
			<div class="header-actions">
				<button id="spotify-login">Spotify email sign-in</button
				><button id="reload" aria-label="Reload service">↻</button>
			</div>
		</header>
		<div class="notice">
			<span id="service-note"
				>Use Spotify email sign-in. Google sign-in is blocked here.</span
			><a href="/source.tar.gz" download>Source</a
			><button class="text-button" data-service="credits">Credits</button>
		</div>
		<main id="stage">
			<div class="start">
				<span class="tag">WEB PLAYER</span>
				<h1>Spotify, in the page.</h1>
				<p>
					Use your Spotify email to sign in.<br />Google sign-in does not work
					in this embedded browser.
				</p>
				<button id="start">Load Spotify</button>
				<p id="status" role="status"></p>
			</div>
		</main>
	</body>
</html>
